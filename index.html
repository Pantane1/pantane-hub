  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { font-family: 'DM Sans', sans-serif; background-color: #f8fafc; margin: 0; padding: 0; }
    h1, h2, h3, h4, .font-display { font-family: 'Syne', sans-serif; }
    .fade-in { animation: fadeIn 0.45s ease-out forwards; }
    .slide-up { animation: slideUp 0.5s cubic-bezier(0.22,1,0.36,1) forwards; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes slideUp { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }
    .stagger-1 { animation-delay: 0.05s; opacity: 0; }
    .stagger-2 { animation-delay: 0.12s; opacity: 0; }
    .stagger-3 { animation-delay: 0.19s; opacity: 0; }
    .stagger-4 { animation-delay: 0.26s; opacity: 0; }
    #root { min-height: 100vh; }

    /* Opening ad — scoped animations, do not affect the rest of the site */
    .ad-scale-in { animation: adScaleIn 0.55s cubic-bezier(0.16,1,0.3,1) forwards; }
    @keyframes adScaleIn { from { opacity: 0; transform: scale(0.94) translateY(14px); } to { opacity: 1; transform: scale(1) translateY(0); } }
    .ad-backdrop-in { animation: adBackdropIn 0.4s ease-out forwards; }
    @keyframes adBackdropIn { from { opacity: 0; } to { opacity: 1; } }
    .ad-float { animation: adFloat 4.5s ease-in-out infinite; }
    @keyframes adFloat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    .ad-glow { animation: adGlow 3s ease-in-out infinite; }
    @keyframes adGlow { 0%, 100% { opacity: 0.55; } 50% { opacity: 1; } }
    .ad-blink { animation: adBlink 1s step-end infinite; }
    @keyframes adBlink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .ad-scale-in, .ad-backdrop-in, .ad-float, .ad-glow, .ad-blink { animation: none !important; opacity: 1 !important; }
    }
  </style>
